<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Sentagram — Daily Sentence Word Game</title>
  <desc>One clever sentence. Three guesses. A fresh puzzle every day.</desc>
  <rect width="1200" height="630" fill="#fff"/>
  <!-- Reuses the existing favicon mark. -->
  <svg x="560" y="48" width="80" height="80" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="14" fill="#f4d975"/>
    <path d="M42 17c-5-4-21-4-21 6 0 10 23 6 23 18 0 12-20 14-27 6" fill="none" stroke="#171717" stroke-width="6" stroke-linecap="round"/>
    <circle cx="49" cy="50" r="3" fill="#171717"/>
  </svg>
  <text x="600" y="253" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="bold" letter-spacing="-4" fill="#171717">Sentagram</text>
  <text x="600" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#60605d">Daily sentence word game</text>
  <rect x="279" y="365" width="163" height="90" rx="8" fill="#f4d878"/>
  <rect x="455" y="365" width="191" height="90" rx="8" fill="#d3c4e6"/>
  <rect x="659" y="365" width="262" height="90" rx="8" fill="#b9d596"/>
  <g text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#171717">
    <text x="360" y="423">One</text>
    <text x="550" y="423">clever</text>
    <text x="790" y="423">sentence.</text>
  </g>
  <text x="600" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#171717">Three guesses. A fresh puzzle every day.</text>
</svg>
